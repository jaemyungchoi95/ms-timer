<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>퇴근까지</title>
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="clock" class="clock">
      <div class="stack">
        <header class="header">
          <div class="titlebox" id="titlebox">
            <h1 class="title-wrap" data-label-display>
              <button id="title" class="title" type="button" data-label-trigger>퇴근까지</button>
            </h1>
            <div class="label-edit" data-label-edit hidden>
              <input class="label-input" type="text" maxlength="12" aria-label="진행 문구" placeholder="진행 문구" data-l10n="ariaLabelRun" data-label-run />
              <input class="label-input" type="text" maxlength="12" aria-label="완료 문구" placeholder="완료 문구" data-l10n="ariaLabelDone" data-label-done />
              <button class="target-btn" type="button" aria-label="확정" data-l10n="ariaOk" data-label-ok>✓</button>
              <button class="target-btn" type="button" aria-label="취소" data-l10n="ariaCancel" data-label-cancel>↻</button>
            </div>
          </div>
          <div class="target" id="target">
            <button class="target-display" type="button" data-target-display></button>
            <!-- 일정 오버레이 패널 — 행(경유지·최종)은 schedule-editor.js 가 동적 생성 -->
            <div class="sched-edit" data-sched-edit hidden>
              <div class="sched-rows" data-sched-rows></div>
              <div class="sched-presets" data-sched-presets></div>
              <div class="sched-controls">
                <button class="target-btn" type="button" aria-label="일정 추가" data-l10n="ariaAddWaypoint" data-sched-add>+</button>
                <span class="sched-spacer"></span>
                <button class="target-btn" type="button" aria-label="확정" data-l10n="ariaOk" data-sched-ok>✓</button>
                <button class="target-btn" type="button" aria-label="취소" data-l10n="ariaCancel" data-sched-cancel>↻</button>
              </div>
            </div>
          </div>
        </header>
        <div class="frame">
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>

        <div class="sep">:</div>

        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>

        <div class="sep">:</div>

        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>

        <div class="dot">.</div>

        <div class="reel" data-reel="100">
          <div class="reel-strip">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </div>
        </div>
        <div class="reel" data-reel="10">
          <div class="reel-strip">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </div>
        </div>
        <div class="reel" data-reel="1">
          <div class="reel-strip">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </div>
        </div>
      </div>      <!-- .frame -->
      </div>        <!-- .stack -->
    </main>
    <script type="module" src="clock.js"></script>
  </body>
</html>
