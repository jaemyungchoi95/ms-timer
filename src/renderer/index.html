<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>퇴근까지</title>
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="clock" class="clock">
      <div class="stack">
        <header class="header">
          <h1 class="title-wrap">
            <img class="title-badge" alt="" data-title-badge hidden />
            <button id="title" class="title" type="button">퇴근까지</button>
          </h1>
          <!-- 일정 모달 v2 — 행(경유지·Finish)은 schedule-editor.js 가 동적 생성 -->
          <div class="sched-edit" data-sched-edit hidden>
            <div class="sched-top">
              <button class="sched-chrome" type="button" aria-label="저장" data-l10n="ariaSave" data-sched-ok><img src="assets/icons/save.png" alt="" /></button>
              <button class="sched-chrome" type="button" aria-label="닫기" data-l10n="ariaClose" data-sched-cancel><img src="assets/icons/x.png" alt="" /></button>
            </div>
            <div class="sched-rows" data-sched-rows></div>
            <div class="sched-bottom">
              <button class="sched-chrome" type="button" aria-label="일정 추가" data-l10n="ariaAddWaypoint" data-sched-add><img src="assets/icons/clock-plus.png" alt="" /></button>
            </div>
          </div>
        </header>
        <div class="frame">
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>

        <div class="sep">:</div>

        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>

        <div class="sep">:</div>

        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>
        <div class="flip" data-flip>
          <div class="flip-top"><span>0</span></div>
          <div class="flip-bottom"><span>0</span></div>
          <div class="flip-fold-top"><span>0</span></div>
          <div class="flip-fold-bottom"><span>0</span></div>
        </div>

        <div class="dot">.</div>

        <div class="reel" data-reel="100">
          <div class="reel-strip">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </div>
        </div>
        <div class="reel" data-reel="10">
          <div class="reel-strip">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </div>
        </div>
        <div class="reel" data-reel="1">
          <div class="reel-strip">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span>
          </div>
        </div>
      </div>      <!-- .frame -->
      </div>        <!-- .stack -->
    </main>
    <script type="module" src="clock.js"></script>
  </body>
</html>
